[workspace]
resolver = "3"
members = ["crates/tangra-proto", "crates/tangra-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/go-tangra/go-tangra-sdk-rust"
publish = false

[workspace.dependencies]
tangra-proto = { path = "crates/tangra-proto" }

prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "server", "channel"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-types = "0.14"
protoc-bin-vendored = "3"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
x509-parser = "0.18"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }

axum = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["full"] }
futures-util = "0.3"
pin-project-lite = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
serde_ignored = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "std", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
thiserror = "2"
if-addrs = "0.15"
async-trait = "0.1"
tempfile = "3"
time = "0.3"
pem = "3"
spiffe = { version = "0.18", default-features = false, features = ["workload-api-x509"] }
include_dir = "0.7"
yaml-rust2 = { version = "0.10", default-features = false }
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
redis = { version = "1", default-features = false, features = ["tokio-comp", "streams"] }
