# CI and release of a go-tangra v4 module written in Rust, for the module's
# own repository (copy to .github/workflows/; the Go modules call this file
# ci.yaml). Same jobs and rules as go-tangra-deployer's .github/workflows/ci.yaml:
# the rust job replaces go vet/test, there is no buf job (no protos).
# Replace notes / tangra-notes with the module's names.
#
# Images: ghcr.io/go-tangra/go-tangra-notes tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (default-branch pushes and tags). There is deliberately NO `latest`
# and NO branch tag.
#
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so an `sdk/v4.0.0` tag never matches it and never builds or pushes an image.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-notes

jobs:
  rust:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Help pages (docs/help): front-matter, slugs, links, images, limits.
      - name: Lint help pages
        uses: go-tangra/go-tangra/.github/actions/docs-lint@v4.10.0
        with:
          tool-version: v4.10.0

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Without a built ui/dist the `ui` feature compiles and serves no remote.
      - name: cargo test
        run: cargo test --all-features --locked

  ui:
    name: UI lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - rust
      - ui
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and main pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}

  # Module catalogue entry (spec 035): on a release tag, publish
  # catalogue-entry.json and bundle.zip (tangra-module.yaml, deploy/bundle/)
  # with a GitHub artifact attestation (the action runs
  # actions/attest-build-provenance), so gateways can list and install this
  # release. Runs after the image is pushed: the action checks it is pullable.
  catalogue:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # tangra-catalogue is a Go tool (go run inside the action).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The permissions command is the module's own Rust binary.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: go-tangra/go-tangra/.github/actions/catalogue-entry@v4.10.0
        with:
          tool-version: v4.10.0
          permissions-command: cargo run -q --locked --bin notes-catalogue-permissions
