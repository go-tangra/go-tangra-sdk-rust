[package]
name = "tangra-notes"
description = "Example go-tangra v4 module in Rust: tenant-scoped notes (the SDK's reference module)"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "tangra-notes"

[features]
default = []
# Embed and serve the built module-federation remote (ui/dist) at /ui/*
# (the Go build tag `ui`). Without a built dist/ the binary logs that it
# serves no remote.
ui = ["tangra-sdk/ui"]

[dependencies]
tangra-sdk = { path = "../../crates/tangra-sdk", features = ["events"] }
tangra-proto.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
include_dir.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tonic.workspace = true
tower.workspace = true
regex.workspace = true
