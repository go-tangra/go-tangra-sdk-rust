[package]
name = "tangra-sdk"
description = "Build go-tangra v4 modules in Rust with the same wire behaviour as Go modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# SPIFFE Workload API identity provider (identity::spiffe, rust-spiffe crate).
spiffe = ["dep:spiffe"]

[dependencies]
tangra-proto.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-types.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
rustls-native-certs.workspace = true
x509-parser.workspace = true
rcgen.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tower.workspace = true
futures-util.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_ignored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
form_urlencoded.workspace = true
uuid.workspace = true
rand.workspace = true
thiserror.workspace = true
if-addrs.workspace = true
async-trait.workspace = true
time.workspace = true
pem.workspace = true
spiffe = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tonic-prost.workspace = true
